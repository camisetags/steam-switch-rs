[package]
name = "steam-switch-firmware"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[target.'cfg(target_os = "espidf")'.dependencies]
aes = "0.8"
anyhow = "1"
controller-core = { path = "../crates/logic" }
esp32-nimble = "0.13.0"
esp-idf-svc = "0.53.0"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
embuild = { version = "0.33", features = ["espidf"] }

[target.'cfg(not(target_os = "espidf"))'.dev-dependencies]
aes = "0.8"
