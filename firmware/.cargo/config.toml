[build]
target = "xtensa-esp32s3-espidf"

[target.xtensa-esp32s3-espidf]
linker = "ldproxy"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
ESP_IDF_VERSION = "v6.1.1"
CARGO_WORKSPACE_DIR = { value = "..", relative = true }
ESP_IDF_SDKCONFIG_DEFAULTS = { value = "sdkconfig.defaults", relative = true }
ESP_IDF_SYS_ROOT_CRATE = "steam-switch-firmware"
ESP_IDF_GLOB_CONFIG_BASE = { value = ".", relative = true }
ESP_IDF_GLOB_CONFIG_PARTITION = "partitions.csv"
MCU = "esp32s3"
